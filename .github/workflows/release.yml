name: Build and Release DeedArchive

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        shell: powershell
        run: npm install --no-audit --no-fund

      - name: Build Portable EXE
        shell: powershell
        run: npm run dist:win

      - name: Show release files
        shell: powershell
        run: Get-ChildItem -Path .\release -Recurse | Format-Table FullName,Length

      - name: Create GitHub Release and upload Portable EXE
        uses: softprops/action-gh-release@v2
        with:
          name: DeedArchive ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/*.exe
